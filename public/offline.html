<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | StartIELTS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 48px 32px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .tip { margin-top: 20px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Internetsiz</h1>
    <p>
      Hozircha internet aloqasi yo'q. Ba'zi sahifalar keshdan ishlashi mumkin —
      aloqani tiklab, qayta urinib ko'ring.
    </p>
    <button onclick="window.location.reload()">Qayta urinish</button>
    <div class="tip">Maslahat: Vocabulary va Writing mashqlari offline ham ochilishi mumkin.</div>
  </div>
</body>
</html>
